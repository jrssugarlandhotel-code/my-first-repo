services:
  - type: web
    name: hotel-sales-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false   # you'll paste your Neon connection string in during setup
      # Optional: fill these in to enable automatic client emails
      # (inquiry acknowledgment + follow-up reminders). Leave blank to
      # skip emails entirely -- everything else still works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: HOTEL_NAME
        sync: false
      - key: FOLLOWUP_DAYS
        value: "3"
      - key: FOLLOWUP_ENABLED
        value: "true"
